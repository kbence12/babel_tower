[project]
name = "babel-tower"
version = "0.1.0"
description = "Eng->Hun translation hobby project. This is for my education, not for actual perf."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ebooklib>=0.21",
    "lxml>=6.1.3",
    "numpy>=2.5.4",
    "sentence-transformers>=6.3.0",
]

[project.scripts]
babel-tower = "babel_tower.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
