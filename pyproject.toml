[project]
name = "babel-tower"
version = "0.1.0"
description = "Eng->Hun translation hobby project. This is for my education, not for actual perf."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ebooklib>=0.21",
    "lxml>=6.1.3",
    "numpy>=2.5.4",
    "sacrebleu>=2.6.0",
    "sacremoses>=0.2.0",
    "sentence-transformers>=6.3.0",
    "sentencepiece>=0.2.3",
]

[project.scripts]
babel-tower = "babel_tower.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import sorting
    "N",            # pep8 naming
    "UP",           # modern syntax for the target Python
    "B",            # likely bugs
    "A",            # shadowing builtins
    "C4",           # comprehensions
    "SIM",          # simplifications
    "RET",          # return statements
    "PTH",          # pathlib over os.path
    "PIE", "PERF",  # small cleanups, performance anti-patterns
    "PL",           # pylint
    "RUF",          # ruff-specific
]
ignore = [
    "PLR2004",  # magic values: thresholds like 0.6 read better inline
    "PLR0913",  # pipeline functions legitimately take several settings
    "PLC0415",  # torch / sentence-transformers are imported lazily on purpose (slow import)
    "RUF001", "RUF002", "RUF003",  # typographic quotes and dashes are the point of this code
]

[tool.ruff.lint.flake8-builtins]
# record fields mirror the JSONL keys
ignorelist = ["id", "type"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0913", "PLR0917"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["ebooklib", "ebooklib.*"]
ignore_missing_imports = true
